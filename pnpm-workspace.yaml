  chokidar: 5.0.0
  lodash: 4.18.1
  undici@^7: 7.29.1
  undici@^6: 6.28.1
  '@tabler/icons-webfont>sharp': '-'
  # Upstreams pin older releases; constrain only these vulnerable dependency edges.
  'ip-cidr>ip-address': 10.7.4
  '@syuilo/aiscript>uuid': 11.1.1
  'sass>immutable': 5.1.9
  'sass-embedded>immutable': 5.1.9
  '@misskey-dev/sharp-read-bmp>sharp': 0.35.5
  '@misskey-dev/summaly>fastify': 5.12.5
engineStrict: true
saveExact: true
shellEmulator: true
